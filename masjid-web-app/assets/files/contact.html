<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta charset="UTF-8">
    <script src="../js/theme-init.js"></script>
    <script src="../js/config.js"></script>
    <title>Contact Us</title>
    <link rel="stylesheet" href="../css/materialdesignicons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style-static.css">
    <style>
        html,
        body {
            overflow: hidden !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body {
            display: flex !important;
            justify-content: center !important;
            align-items: stretch !important;
        }

        .scroll-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            width: 100%;
        }

        .contact-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(3, 99, 53, 0.08);
            text-align: left;
        }

        .contact-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 16px;
            gap: 16px;
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .contact-icon {
            color: var(--primary-green);
            font-size: 24px;
            margin-top: -2px;
        }

        .contact-text {
            color: var(--text-primary);
            line-height: 1.5;
        }

        .contact-text a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-text a:hover {
            text-decoration: underline;
        }

        .map-container {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(3, 99, 53, 0.08);
            margin-top: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary-green);
            color: white;
            font-size: 24px;
            text-decoration: none;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(3, 99, 53, 0.2);
        }

        .social-btn:hover {
            transform: scale(1.05);
            background: #026b36;
        }

        .social-btn.facebook { background: #1877F2; box-shadow: 0 4px 15px rgba(24, 119, 242, 0.2); }
        .social-btn.instagram { background: #E4405F; box-shadow: 0 4px 15px rgba(228, 64, 95, 0.2); }
        .social-btn.x { background: #000000; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
        .social-btn.youtube { background: #FF0000; box-shadow: 0 4px 15px rgba(255, 0, 0, 0.2); }
        .social-btn.whatsapp { background: #25D366; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2); }
        .social-btn.telegram { background: #0088cc; box-shadow: 0 4px 15px rgba(0, 136, 204, 0.2); }

        .social-btn:hover {
            filter: brightness(1.1);
            transform: scale(1.05);
        }

        .dark-mode .contact-card {
            background: rgba(3, 99, 53, 0.2);
            border-color: rgba(219, 141, 13, 0.3);
        }

        .dark-mode .map-container {
            border-color: rgba(219, 141, 13, 0.3);
            filter: contrast(1.1) brightness(0.9);
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title"><i class="mdi mdi-email-outline"></i> Contact Us</h1>
            <div class="header-actions">
                <button class="btn-icon" id="theme-toggle-btn" title="Toggle Theme">
                    <i class="mdi mdi-weather-night"></i>
                </button>
            </div>
        </div>

        <!-- Islamic Geometric Divider -->
        <div class="geometric-divider">
            <div class="line"></div>
            <div class="center-icon"></div>
            <div class="line"></div>
        </div>

        <div class="scroll-content">
            <div class="contact-card">
                <div class="contact-item">
                    <i class="mdi mdi-map-marker contact-icon"></i>
                    <div class="contact-text" id="contact-address">
                        <strong>Address:</strong><br>
                        Masjid Address,<br>
                        City, Postcode
                    </div>
                </div>

                <div class="map-container">
                    <iframe id="contact-map" src="about:blank" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>

            <div class="contact-card">
                <div class="contact-item">
                    <i class="mdi mdi-phone contact-icon"></i>
                    <div class="contact-text">
                        <strong>Phone:</strong><br>
                        <a href="#" id="contact-phone">01 234 5678</a>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="mdi mdi-email contact-icon"></i>
                    <div class="contact-text">
                        <strong>Email:</strong><br>
                        <a href="mailto:info@masjid.com" id="contact-email">info@masjid.com</a>
                    </div>
                </div>

                <div class="contact-item">
                    <i class="mdi mdi-web contact-icon"></i>
                    <div class="contact-text">
                        <strong>Website:</strong><br>
                        <a href="#" id="contact-site">masjid.com</a>
                    </div>
                </div>
            </div>

            <div class="social-links" id="social-links-container">
                <!-- Dynamically populated from config.js -->
            </div>

        </div>
        <div class="page-brand"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Load config from parent (PWA shell) or local script tag
            const config = (window.parent && window.parent.APP_CONFIG) || (typeof APP_CONFIG !== 'undefined' ? APP_CONFIG : null);
            if (!config) return;

            // Update Contact Info
            const addrEl = document.getElementById('contact-address');
            if (addrEl) {
                if (config.masjidAddress && config.masjidAddress.trim()) {
                    // Build via DOM nodes to prevent XSS — address must not be raw innerHTML
                    addrEl.innerHTML = '';
                    const strong = document.createElement('strong');
                    strong.textContent = 'Address:';
                    addrEl.appendChild(strong);
                    addrEl.appendChild(document.createElement('br'));
                    addrEl.appendChild(document.createTextNode(config.masjidAddress));
                } else {
                    const item = addrEl.closest('.contact-item');
                    if (item) item.style.display = 'none';
                }
            }
            
            const mapContainer = document.querySelector('.map-container');
            if (mapContainer) {
                const address = config.masjidAddress && config.masjidAddress.trim();
                if (config.showGoogleMap && address) {
                    const mapEl = document.getElementById('contact-map');
                    const query = encodeURIComponent(address).replace(/%20/g, '+');
                    if (mapEl) mapEl.src = `https://maps.google.com/maps?q=${query}&output=embed`;
                } else {
                    mapContainer.style.display = 'none';
                }
            }

            const phoneLink = document.getElementById('contact-phone');
            if (phoneLink) {
                if (config.masjidPhone && config.masjidPhone.trim()) {
                    // Strip to safe tel: chars only (digits, +, space, hyphen, parens)
                    const safePhone = config.masjidPhone.replace(/[^0-9+\-\s()]/g, '');
                    phoneLink.href = `tel:${safePhone.replace(/\s+/g, '')}`;
                    phoneLink.textContent = config.masjidPhone;
                } else {
                    const item = phoneLink.closest('.contact-item');
                    if (item) item.style.display = 'none';
                }
            }

            const emailLink = document.getElementById('contact-email');
            if (emailLink) {
                if (config.masjidEmail && config.masjidEmail.trim()) {
                    emailLink.href = `mailto:${config.masjidEmail}`;
                    emailLink.textContent = config.masjidEmail;
                } else {
                    const item = emailLink.closest('.contact-item');
                    if (item) item.style.display = 'none';
                }
            }

            const siteLink = document.getElementById('contact-site');
            if (siteLink) {
                if (config.masjidSite && config.masjidSite.trim()) {
                    siteLink.textContent = config.masjidSite;
                    siteLink.onclick = function () {
                        if (window.parent && window.parent.loadContent) {
                            window.parent.loadContent(config.masjidBaseUrl);
                        } else {
                            window.location.href = config.masjidBaseUrl;
                        }
                        return false;
                    };
                } else {
                    const item = siteLink.closest('.contact-item');
                    if (item) item.style.display = 'none';
                }
            }

            // Update Social Links Dynamically
            const socialContainer = document.getElementById('social-links-container');
            if (socialContainer && config.masjidSocialLinks) {
                const platforms = {
                    facebook: { icon: 'mdi-facebook', title: 'Facebook' },
                    instagram: { icon: 'mdi-instagram', title: 'Instagram' },
                    x: { icon: 'mdi-twitter', title: 'X (Twitter)' },
                    youtube: { icon: 'mdi-youtube', title: 'YouTube' },
                    whatsapp: { icon: 'mdi-whatsapp', title: 'WhatsApp' },
                    telegram: { icon: 'mdi-send', title: 'Telegram' }
                };

                // Reject javascript:, vbscript:, and non-https/http social URLs
                function safeSocialUrl(url) {
                    if (!url || typeof url !== 'string') return '';
                    const t = url.trim().toLowerCase();
                    if (t.startsWith('javascript:') || t.startsWith('vbscript:') || t.startsWith('data:')) return '';
                    return url.trim();
                }

                socialContainer.innerHTML = '';
                Object.entries(config.masjidSocialLinks).forEach(([key, url]) => {
                    const safeUrl = safeSocialUrl(url);
                    if (safeUrl && platforms[key]) {
                        const p = platforms[key];
                        const a = document.createElement('a');
                        a.href = safeUrl;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        a.className = `social-btn ${key}`;
                        a.title = p.title;
                        a.innerHTML = `<i class="mdi ${p.icon}"></i>`;
                        socialContainer.appendChild(a);
                    }
                });
            }

            // Update Brand (if injectBranding didn't catch it or for standalone)
            const brandLogo = document.getElementById('brand-logo');
            if (brandLogo) brandLogo.alt = `${config.masjidName} logo`;
            
            const brandSite = document.getElementById('brand-site');
            if (brandSite) brandSite.textContent = config.masjidSite;

            // Final Polish: If a card becomes empty, hide it
            document.querySelectorAll('.contact-card').forEach(card => {
                const visibleItems = Array.from(card.querySelectorAll('.contact-item, .map-container')).filter(el => el.style.display !== 'none');
                if (visibleItems.length === 0) {
                    card.style.display = 'none';
                }
            });
        });
    </script>
</body>

</html>
