<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta charset="UTF-8">
    <script src="../js/theme-init.js"></script>
    <script src="../js/config.js"></script>
    <title>Page Not Found</title>
    <link rel="stylesheet" href="../css/materialdesignicons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style-static.css">
    <style>
        html,
        body {
            overflow: hidden !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body {
            display: flex !important;
            justify-content: center !important;
            align-items: stretch !important;
        }

        .scroll-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 400px;
            width: 100%;
        }

        .error-icon {
            font-size: 80px;
            color: var(--primary-gold);
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .error-title {
            font-size: 2.5rem;
            color: var(--primary-green);
            margin: 0 0 10px 0;
            font-weight: 800;
        }

        .error-message {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-home {
            background: linear-gradient(135deg, var(--primary-green), #059669);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .dark-mode .error-title {
            color: var(--primary-gold);
        }

        .dark-mode .error-message {
            color: #cbd5e1;
        }

        .dark-mode .btn-home {
            background: linear-gradient(135deg, var(--primary-gold), #b4720a);
            box-shadow: 0 4px 15px rgba(219, 141, 13, 0.2);
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title"><i class="mdi mdi-alert-circle-outline"></i> 404</h1>
            <div class="header-actions">
                <button class="btn-icon" id="theme-toggle-btn" title="Toggle Theme">
                    <i class="mdi mdi-weather-night"></i>
                </button>
            </div>
        </div>

        <div class="geometric-divider">
            <div class="line"></div>
            <div class="center-icon"></div>
            <div class="line"></div>
        </div>

        <div class="scroll-content">
            <div class="error-container">
                <i class="mdi mdi-map-marker-question error-icon"></i>
                <h2 class="error-title">Oops!</h2>
                <p class="error-message">The page you are looking for doesn't exist or has been moved.</p>
                <a href="/" class="btn-home" onclick="event.preventDefault(); if(window.parent && window.parent.loadContent) window.parent.loadContent('assets/files/prayers-tables.html', null, true); else window.location.href='/';">
                    <i class="mdi mdi-home"></i> Back to Home
                </a>
            </div>
        </div>

        <div class="page-brand"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Theme toggle handled by theme-init.js usually, but we ensure it works
            const themeBtn = document.getElementById('theme-toggle-btn');
            if (themeBtn) {
                themeBtn.addEventListener('click', function() {
                    document.documentElement.classList.toggle('dark-mode');
                    localStorage.setItem('theme', document.documentElement.classList.contains('dark-mode') ? 'dark' : 'light');
                    // Sync with parent if exists
                    if (window.parent && window.parent.updateThemeUI) window.parent.updateThemeUI();
                });
            }
        });
    </script>
</body>

</html>
