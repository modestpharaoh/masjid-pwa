<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta charset="UTF-8">
    <script src="../js/theme-init.js"></script>
    <script src="../js/config.js"></script>
    <title>Tasbih</title>
    <link rel="stylesheet" href="../css/materialdesignicons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style-static.css">
    <style>
        :root {
            --tasbih-glow: rgba(var(--primary-green-rgb), 0.3);
        }

        html,
        body {
            overflow: hidden !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body {
            display: flex !important;
            justify-content: center !important;
            align-items: stretch !important;
        }

        .scroll-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            width: 100%;
        }

        .tasbih-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px;
        }

        /* Dhikr Selection */
        .dhikr-selector {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            padding: 10px 5px;
            margin-bottom: 25px;
        }

        .dhikr-chip span {
            display: block;
            font-size: 0.75rem;
            font-family: 'Aref Ruqaa', serif;
            font-size: 1.25rem;
            line-height: 1.4;
        }

        .dhikr-chip {
            background: rgba(var(--primary-green-rgb), 0.08);
            border: 1px solid rgba(var(--primary-green-rgb), 0.15);
            padding: 12px 14px;
            border-radius: 12px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
            flex: 1 1 calc(33.333% - 12px);
            /* 3 per row on mobile usually */
            max-width: calc(50% - 12px);
        }

        @media (max-width: 360px) {
            .dhikr-chip {
                flex: 1 1 calc(50% - 12px);
            }
        }

        .dhikr-chip.active {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
            box-shadow: 0 4px 12px rgba(var(--primary-green-rgb), 0.3);
        }

        /* The Counter Button */
        .counter-wrapper {
            position: relative;
            margin: 20px 0 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-counter-btn {
            width: clamp(220px, 60vw, 300px);
            height: clamp(220px, 60vw, 300px);
            border-radius: 50%;
            background: var(--card-bg);
            border: 8px solid rgba(var(--primary-green-rgb), 0.1);
            position: relative;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08),
                inset 0 0 20px rgba(var(--primary-green-rgb), 0.05);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            z-index: 2;
        }

        .main-counter-btn:active {
            transform: scale(0.95);
            background: rgba(var(--primary-green-rgb), 0.15);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }



        .count-display {
            font-size: clamp(4.5rem, 15vw, 6rem);
            font-weight: 800;
            color: var(--primary-green);
            line-height: 1;
            margin: 0;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 2px 10px rgba(var(--primary-green-rgb), 0.2);
        }

        .count-target {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 5px;
            opacity: 0.7;
        }

        /* Controls */
        .tasbih-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            border: 1px solid rgba(var(--primary-green-rgb), 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-secondary);
            font-size: 22px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .control-btn.active {
            color: var(--primary-gold);
            border-color: var(--primary-gold);
            background: rgba(var(--primary-gold-rgb), 0.05);
        }

        /* Stats & History */
        .stats-section {
            width: 100%;
            padding: 20px;
            border-top: 1px solid rgba(var(--primary-green-rgb), 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 12px;
            text-align: left;
            border: 1px solid rgba(var(--primary-green-rgb), 0.08);
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-green);
        }

        /* Dark Mode Adjustments */
        .dark-mode .main-counter-btn {
            background: rgba(var(--primary-green-rgb), 0.15);
            border-color: rgba(var(--primary-green-rgb), 0.2);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
        }

        .dark-mode .control-btn {
            background: rgba(var(--primary-green-rgb), 0.1);
            color: var(--text-secondary);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .dark-mode .control-btn.active {
            color: var(--primary-gold);
            border-color: var(--primary-gold);
            background: rgba(var(--primary-gold-rgb), 0.15);
            box-shadow: 0 0 15px rgba(var(--primary-gold-rgb), 0.2);
        }

        .dark-mode .stat-card {
            background: rgba(6, 30, 20, 0.6);
            border-color: rgba(var(--primary-gold-rgb), 0.2);
        }

        .dark-mode .count-target {
            color: var(--primary-gold);
        }

        /* Circular progress ring */
        .progress-ring {
            position: absolute;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.35s;
            stroke-linecap: round;
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="page-header">
            <h1 class="page-title"><i class="mdi mdi-counter"></i> Tasbih</h1>
            <div class="header-actions">
                <button class="btn-icon theme-toggle-btn" id="theme-toggle-btn" title="Toggle Theme">
                    <i class="mdi mdi-weather-night"></i>
                </button>
            </div>
        </div>

        <!-- Islamic Geometric Divider -->
        <div class="geometric-divider">
            <div class="line"></div>
            <div class="center-icon"></div>
            <div class="line"></div>
        </div>

        <div class="scroll-content">
            <div class="tasbih-container">
                <!-- Dhikr Selector -->
                <div class="dhikr-selector" id="dhikr-selector">
                    <div class="dhikr-chip active" data-goal="33" data-arabic="سبحان الله">SubhanAllah <span>سبحان
                            الله</span></div>
                    <div class="dhikr-chip" data-goal="33" data-arabic="الحمد لله">Alhamdulillah <span>الحمد لله</span>
                    </div>
                    <div class="dhikr-chip" data-goal="33" data-arabic="الله أكبر">Allahu Akbar <span>الله أكبر</span>
                    </div>
                    <div class="dhikr-chip" data-goal="100" data-arabic="أستغفر الله">Astaghfirullah <span>أستغفر
                            الله</span></div>
                    <div class="dhikr-chip" data-goal="100" data-arabic="لا إله إلا الله">La ilaha illallah <span>لا إله
                            إلا
                            الله</span></div>
                    <div class="dhikr-chip" data-goal="100" data-arabic="ذكر">Custom <span>ذكر</span></div>
                </div>

                <!-- Current Dhikr Display -->
                <div id="current-dhikr-display" style="margin-bottom: 30px;">
                    <h2 id="dhikr-en" style="margin: 0; color: var(--text-primary); font-size: 1.2rem;">SubhanAllah</h2>
                    <h3 id="dhikr-ar"
                        style="margin: 5px 0 0 0; color: var(--primary-gold); font-size: 1.8rem; font-family: 'Aref Ruqaa', serif;">
                        سبحان الله</h3>
                </div>

                <div class="counter-wrapper">
                    <!-- Progress Ring -->
                    <svg class="progress-ring" viewBox="0 0 100 100"
                        style="width: clamp(240px, 66vw, 340px); height: clamp(240px, 66vw, 340px);">
                        <circle class="progress-ring__circle-bg" stroke="rgba(16, 185, 129, 0.05)" stroke-width="4"
                            fill="transparent" r="46" cx="50" cy="50" />
                        <circle id="progress-indicator" class="progress-ring__circle" stroke="var(--primary-green)"
                            stroke-width="4" fill="transparent" r="46" cx="50" cy="50" stroke-dasharray="0"
                            stroke-dashoffset="0" />
                    </svg>

                    <button class="main-counter-btn" id="tasbih-btn" aria-label="Increment Counter">
                        <span class="count-display" id="main-count">0</span>
                        <span class="count-target" id="count-target-display">Target: 33</span>
                    </button>
                </div>

                <div class="tasbih-controls">
                    <button class="control-btn" id="reset-btn" title="Reset Counter">
                        <i class="mdi mdi-refresh"></i>
                    </button>
                    <button class="control-btn active" id="vibration-btn" title="Toggle Vibration">
                        <i class="mdi mdi-vibrate"></i>
                    </button>
                </div>

                <div class="stats-section">
                    <div class="stat-card">
                        <span class="label">Total Today</span>
                        <span class="value" id="total-today">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">Total Cycles</span>
                        <span class="value" id="total-cycles">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="page-brand"></div>
    </div>

    <script src="../js/tasbih.js"></script>
</body>

</html>
